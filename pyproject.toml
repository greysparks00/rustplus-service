[project]
name = "time"
description="Gets the current time and timezone so all Junction apps have a synced time."
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "datetime>=6.0",
    "fastapi",
    "tzdata>=2026.5",
    "uvicorn",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
